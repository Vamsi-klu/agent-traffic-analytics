# AgentCake as a wheel: no dependencies, standard library only. flit_core builds the wheel from a checkout
# (`pip wheel .`); it is not shipped and AgentCake does not need it to run. Everything inside agentcake/ (schema.sql,
# static/, data/) goes into the wheel. A release (tools/release.py) writes the same wheel itself from
# this file's [project] table, with the local pages compiled into agentcake/ and cake.js minified, without what only a
# checkout uses (cake.js's sources, the evaluation: tools/releasing/release.json), and the release folder
# (agentcake-<version>.tar.gz, also a source distribution) from [tool.flit.sdist] below.
[build-system]
requires = ["flit_core >=3.12,<4"]  # 3.12: the licence as an SPDX expression (PEP 639)
build-backend = "flit_core.buildapi"

[project]
name = "agentcake"
dynamic = ["version", "description"]  # agentcake/__init__.py: __version__ and the docstring's first line
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]  # in the wheel's .dist-info/licenses/ and the release folder

# The project's links on PyPI, under PyPA's well-known labels; a file is linked at this release's tag, as README does.
[project.urls]
Source = "https://github.com/tartini-ai/agent-traffic-analytics"
Issues = "https://github.com/tartini-ai/agent-traffic-analytics/issues"
Changelog = "https://github.com/tartini-ai/agent-traffic-analytics/blob/v0.6.1/CHANGELOG.md"

[project.scripts]
agentcake = "agentcake.cli:main"

# The release folder: run it with bin/agentcake (INSTALL.md), install it on a server (SERVER.md: docker-compose.yml,
# Dockerfile, .dockerignore and deploy/, which holds the Caddyfile and cake.service). A release copies the sites'
# middleware (edge/) into the package, like the compiled pages, so it is not listed here. Tests, tools and the web
# sources stay in the repository: they need the whole checkout, and README's pictures (docs/assets/) are for the
# repository's page on GitHub.
[tool.flit.sdist]
include = ["bin/", "deploy/", "docs/", "Dockerfile", ".dockerignore", "docker-compose.yml", "AGENTS.md",
           "INSTALL.md", "PRIVACY.md", "SERVER.md", "THIRD_PARTY.md"]
exclude = ["web/", "tests/", "tools/", "eval/", "edge/", "docs/assets/"]
