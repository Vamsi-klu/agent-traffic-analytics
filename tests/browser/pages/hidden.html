<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hidden by the site owner · cake.js browser test</title>
<script src="/cake.js" data-site="{{SITE_KEY}}" defer></script>
</head>
<body>
<h1>Your account</h1>
<p id="everyone">Everyone's replay shows this sentence.</p>
<section class="account">
<h2>The owner hides this heading</h2>
<p>The owner's hide_selectors keep this paragraph out of every upload.</p>
</section>
<p><label>Open note <input id="open"></label></p>
<p><label>Hidden note <input id="owner-note"></label></p>
</body>
</html>
