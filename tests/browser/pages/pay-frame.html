<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payment frame · cake.js browser test</title>
<style>body { font: 16px/1.5 system-ui, sans-serif; margin: 8px; } label { display: block; margin-top: 8px; }</style>
</head>
<body>
<form id="pay-form" onsubmit="return false">
<label for="holder">Name on card</label><input id="holder" type="text" autocomplete="off">

</form>
</body>
</html>
