# Build a release of AgentCake when a v<version> tag is pushed (we build it, people download it).
#
# It runs the same command as a release built by hand, `python3 -I tools/release.py build`, twice, and stops unless
# both builds have the same SHA256SUMS (the same commit gives the same bytes). The files then go on a DRAFT release:
# the maintainer reads it and publishes it by hand, and publishing it runs pypi.yml, which uploads the wheel to PyPI.
# Nothing goes to npm or Docker Hub. The tag's commit already carries the lists refreshed for it (`release.py refresh`
# before tagging); this job does not fetch new ones.
#
# Actions are pinned by commit; the version is in the comment.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to create the draft release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep both versions equal to tools/releasing/release.json "toolchain" (tests/test_release_workflow.py checks).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Build the release
        run: python3 -I tools/release.py build --tag "$GITHUB_REF_NAME" --out dist
      - name: Build it again; both builds must be the same bytes
        run: |
          python3 -I tools/release.py build --tag "$GITHUB_REF_NAME" --out dist-again
          cmp dist/SHA256SUMS dist-again/SHA256SUMS
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Put the files on a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME"
          --notes "Built from this tag by .github/workflows/release.yml. Check what you download with: shasum -a 256 -c SHA256SUMS"
